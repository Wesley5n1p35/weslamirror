<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WeslaMirror</title>
    <!-- PeerJS for ultra-simple, zero-config WebRTC peer-to-peer connection -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #videoContainer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(18, 20, 29, 0.85);
            backdrop-filter: blur(20px);
            padding: 30px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: opacity 0.4s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #007AFF, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 24px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff9500;
        }

        .dot.connected {
            background: #34c759;
            box-shadow: 0 0 10px #34c759;
        }

        .code-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 160px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            text-transform: uppercase;
        }

        button {
            height: 48px;
            padding: 0 24px;
            border-radius: 12px;
            border: none;
            background: #007AFF;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.97);
            background: #0062cc;
        }

        .floating-controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 12px;
            opacity: 0.95;
            background: rgba(15, 18, 26, 0.75);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        .floating-controls:hover {
            opacity: 1;
            box-shadow: 0 12px 35px rgba(0, 122, 255, 0.4);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: #007AFF;
        }

        /* Rotation helper classes */
        .rot-0 {
            transform: rotate(0deg);
            max-width: 100vw;
            max-height: 100vh;
        }
        .rot-90 {
            transform: rotate(90deg);
            width: 100vh !important;
            height: 100vw !important;
            max-width: none !important;
            max-height: none !important;
        }
        .rot-180 {
            transform: rotate(180deg);
            max-width: 100vw;
            max-height: 100vh;
        }
        .rot-270 {
            transform: rotate(270deg);
            width: 100vh !important;
            height: 100vw !important;
            max-width: none !important;
            max-height: none !important;
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="remoteVideo" controls autoplay playsinline></video>
        <img id="remoteImg" style="display:none; width: 100%; height: 100%; object-fit: contain;" alt="Mirror stream" />
    </div>

    <div id="overlay" class="overlay">
        <h1>WeslaMirror</h1>
        <p class="subtitle">Tesla Screen Mirroring & Media Player</p>

        <div class="status-badge">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Waiting for iPhone connection...</span>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; width: 100%;">
            <button id="tabMirror" style="flex: 1; background: #007AFF;" onclick="selectMode('mirror')">Screen Mirror</button>
            <button id="tabMedia" style="flex: 1; background: rgba(255,255,255,0.15);" onclick="selectMode('media')">Play Video Media</button>
        </div>

        <div class="code-input-group">
            <input type="text" id="ipInput" value="172.20.10.1" placeholder="172.20.10.1" style="width: 200px; font-size: 16px; text-transform: none; letter-spacing: 0;">
            <button id="connectBtn" onclick="connectToRoom()">Connect</button>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <span style="font-size: 12px; color: #8e8e93;">Hotspot IP: Check WeslaMirror app screen on iPhone</span>
        </div>
        <p id="modeHint" style="font-size: 13px; color: #8e8e93;">Make sure "Broadcast Screen" is active in WeslaMirror on your iPhone.</p>
    </div>

    <div class="floating-controls">
        <button class="icon-btn" onclick="cycleRotate()">🔄 Rotate 90°</button>
        <button class="icon-btn" onclick="flip180()">🔃 Flip 180°</button>
        <button class="icon-btn" onclick="toggleFit()">↔️ Fit / Fill</button>
        <button class="icon-btn" onclick="toggleOverlay()">⚙️ Menu</button>
        <button class="icon-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>

    <script>
        let peer = null;
        let activeCall = null;
        const video = document.getElementById('remoteVideo');
        const img = document.getElementById('remoteImg');
        const overlay = document.getElementById('overlay');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let currentRotation = 0; // 0, 90, 180, 270

        function applyRotation() {
            video.className = 'rot-' + currentRotation;
            img.className = 'rot-' + currentRotation;
        }

        function cycleRotate() {
            currentRotation = (currentRotation + 90) % 360;
            applyRotation();
        }

        function flip180() {
            currentRotation = (currentRotation + 180) % 360;
            applyRotation();
        }

        // Auto-detect aspect ratio adjustments
        video.addEventListener('loadedmetadata', () => {
            console.log(`Video loaded: ${video.videoWidth}x${video.videoHeight}`);
            if (video.videoWidth > video.videoHeight) {
                // Native landscape media is already upright
                currentRotation = 0;
                applyRotation();
            }
        });

        // Check URL parameters for IP and room code e.g. ?ip=172.20.10.1 or ?room=WESLA
        const urlParams = new URLSearchParams(window.location.search);
        const initialIp = urlParams.get('ip') || '172.20.10.1';
        const ipField = document.getElementById('ipInput');
        if (ipField) ipField.value = initialIp;

        function initPeer() {
            const teslaPeerId = 'tesla_' + Math.random().toString(36).substr(2, 6);
            peer = new Peer(teslaPeerId, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                console.log('Tesla Browser Peer ready:', id);
                connectToRoom();
            });

            peer.on('call', (call) => {
                console.log('Incoming stream call from iPhone');
                call.answer(); // Answer with no back stream
                call.on('stream', (remoteStream) => {
                    console.log('Got remote stream!');
                    video.srcObject = remoteStream;
                    video.play().catch(e => console.log('Autoplay handled:', e));
                    setConnectedState(true);
                });
                activeCall = call;
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                statusText.innerText = 'Connection error: ' + err.type;
            });
        }

        let currentMode = 'mirror';

        function selectMode(mode) {
            currentMode = mode;
            const tabMedia = document.getElementById('tabMedia');
            const tabMirror = document.getElementById('tabMirror');
            const modeHint = document.getElementById('modeHint');

            if (mode === 'media') {
                tabMedia.style.background = '#007AFF';
                tabMirror.style.background = 'rgba(255,255,255,0.15)';
                modeHint.innerText = 'Direct local media playback — no screen broadcast needed!';
            } else {
                tabMirror.style.background = '#007AFF';
                tabMedia.style.background = 'rgba(255,255,255,0.15)';
                modeHint.innerText = 'Full iPhone screen mirror — start broadcast in WeslaMirror app.';
            }
        }

        function getCustomHost() {
            const input = document.getElementById('ipInput');
            return (input && input.value.trim()) ? input.value.trim() : '172.20.10.1';
        }

        function connectToRoom() {
            const host = getCustomHost();
            statusText.innerText = 'Searching for iPhone at ' + host + '...';
            statusDot.className = 'dot';

            if (currentMode === 'media') {
                playMediaDirectly();
                return;
            }

            tryLocalStream();

            // Connect WebRTC peer channel to iPhone
            if (peer && !peer.destroyed) {
                const conn = peer.connect('iphone_WESLA');
                conn.on('open', () => {
                    console.log('Connected to iPhone signaling channel');
                    conn.send({ type: 'request_stream' });
                    statusText.innerText = 'Connected! Starting stream...';
                });

                conn.on('data', (data) => {
                    console.log('Received data from iPhone:', data);
                    if (data && data.orientation !== undefined) {
                        // ReplayKit orientation: 1 = Portrait, 3 = LandscapeRight, 4 = LandscapeLeft
                        if (data.orientation === 3 || data.orientation === 4) {
                            // Landscape orientation: flipped 180
                            currentRotation = data.orientation === 3 ? 90 : 270;
                        } else {
                            // Vertical / Portrait orientation: flip back 180 to 0
                            currentRotation = 0;
                        }
                        applyRotation();
                    }
                });

                conn.on('close', () => {
                    setConnectedState(false);
                });
            }
        }

        function playMediaDirectly() {
            const host = getCustomHost();
            statusText.innerText = 'Connecting to media at ' + host + '...';
            img.style.display = 'none';
            video.style.display = 'block';

            const streamEndpoints = [
                'http://' + host + ':8080/sample.mp4',
                'http://172.20.10.1:8080/sample.mp4',
                'http://wes.local:8080/sample.mp4',
                'http://192.0.0.1:8080/sample.mp4'
            ];

            function tryEndpoint(index) {
                if (index >= streamEndpoints.length) {
                    statusText.innerText = 'Could not reach iPhone media server at ' + host;
                    return;
                }
                const url = streamEndpoints[index];
                statusText.innerText = 'Trying: ' + url;
                video.src = url;
                video.play().then(() => {
                    console.log('Successfully streaming video from iPhone:', url);
                    setConnectedState(true);
                }).catch(err => {
                    console.log('Failed endpoint ' + url + ':', err);
                    tryEndpoint(index + 1);
                });
            }

            tryEndpoint(0);
        }

        let isStreamActive = false;
        let pollTimer = null;

        function tryLocalStream() {
            const host = getCustomHost();
            const candidateUrls = [
                'http://' + host + ':81/?t=',
                'http://172.20.10.1:81/?t=',
                'http://wes.local:81/?t=',
                'http://192.0.0.1:81/?t='
            ];

            function testNext(index) {
                if (isStreamActive) return;
                if (index >= candidateUrls.length) {
                    statusText.innerText = 'Waiting for iPhone broadcast (check hotspot & app)...';
                    // Auto retry polling every 2 seconds until connected
                    if (!pollTimer) {
                        pollTimer = setTimeout(() => {
                            pollTimer = null;
                            if (!isStreamActive) tryLocalStream();
                        }, 2000);
                    }
                    return;
                }
                const testImg = new Image();
                const target = candidateUrls[index] + new Date().getTime();
                
                testImg.onload = function() {
                    console.log('Local stream active at:', candidateUrls[index]);
                    isStreamActive = true;
                    img.src = target;
                    img.style.display = 'block';
                    video.style.display = 'none';
                    applyRotation();
                    setConnectedState(true);
                    
                    // Periodic aspect ratio checker for live MJPEG stream
                    if (!window._aspectInterval) {
                        window._aspectInterval = setInterval(() => {
                            if (img.naturalWidth && img.naturalHeight) {
                                if (img.naturalWidth > img.naturalHeight) {
                                    // Wide buffer (landscape) -> rotated 180 degrees
                                    if (currentRotation !== 180) {
                                        currentRotation = 180;
                                        applyRotation();
                                    }
                                } else {
                                    // Tall buffer (vertical/portrait) -> flip back 180 to 0 degrees
                                    if (currentRotation !== 0) {
                                        currentRotation = 0;
                                        applyRotation();
                                    }
                                }
                            }
                        }, 600);
                    }
                };
                testImg.onerror = function() {
                    testNext(index + 1);
                };
                testImg.src = target;
            }
            testNext(0);
        }

        function setConnectedState(connected) {
            if (connected) {
                statusDot.className = 'dot connected';
                statusText.innerText = 'Playback Active';
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 1500);
            } else {
                statusDot.className = 'dot';
                statusText.innerText = 'Waiting for iPhone...';
                overlay.classList.remove('hidden');
            }
        }

        function toggleFit() {
            const currentFit = video.style.objectFit || 'contain';
            const nextFit = currentFit === 'cover' ? 'contain' : 'cover';
            video.style.objectFit = nextFit;
            img.style.objectFit = nextFit;
        }

        function toggleOverlay() {
            overlay.classList.toggle('hidden');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        }

        // Initialize peer connection on load
        window.addEventListener('load', initPeer);
    </script>
</body>
</html>
